on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend (no implementado)
    runs-on: ubuntu-latest
    environment: deploy-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bloqueo de seguridad
        run: |
          echo "Despliegue de backend no implementado en Etapa 2."
          echo "No se descarga, publica ni despliega nada."
          exit 1
